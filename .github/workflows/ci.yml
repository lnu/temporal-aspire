name: Build & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Verify Aspire CLI version
        run: dotnet tool run aspire -- --version

      - name: Restore packages
        run: dotnet restore TemporalAspire.slnx

      - name: Build
        run: dotnet build TemporalAspire.slnx --configuration Release --no-restore --nologo

      - name: Unit tests
        run: dotnet test tests/TemporalCommunity.Aspire.Hosting.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=unit.trx"

      - name: Install just
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@just

      - name: Install Temporal CLI
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) cli_arch=amd64 ;;
            aarch64|arm64) cli_arch=arm64 ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          curl -fsSL "https://temporal.download/cli/archive/latest?platform=linux&arch=${cli_arch}" -o temporal.tar.gz
          tar -xzf temporal.tar.gz temporal
          mkdir -p "$HOME/.local/bin"
          install -m 0755 temporal "$HOME/.local/bin/temporal"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          temporal --version

      - name: Install shutdown-test prerequisites
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lsof
          command -v lsof

      - name: Run Temporal development-server integration tests
        if: matrix.os == 'ubuntu-latest'
        run: just integration-test

      - name: Verify package assets
        if: matrix.os == 'ubuntu-latest'
        run: just pack-verify

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-results-${{ matrix.os }}
          path: tests/**/*.trx
